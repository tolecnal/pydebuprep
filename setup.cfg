[metadata]
name = pydebuprep
version = attr: pydebuprep.__version__
description = Read-only post-upgrade health report for Debian and Ubuntu
long_description = file: README.md
long_description_content_type = text/markdown
author = Jostein Elvaker Haande
author_email = jehaande@gmail.com
license = MIT
license_files = LICENSE
classifiers =
    Environment :: Console
    License :: OSI Approved :: MIT License
    Operating System :: POSIX :: Linux
    Programming Language :: Python :: 3
    Topic :: System :: Systems Administration

[options]
package_dir =
    =src
packages = find:
python_requires = >=3.10
install_requires =
    PyYAML

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    pydebuprep = pydebuprep.cli:main

[options.extras_require]
dev =
    pytest
    ruff
    flake8
    mypy
    types-PyYAML
