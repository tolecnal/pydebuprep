# pydebuprep configuration
#
# Read from /etc/pydebuprep.conf if it exists, or from the file given with --config.
# Every value below is the built-in default; keep only what you change.
# Command-line options override these settings. Check a file with:
#   pydebuprep configtest --config FILE

report:
  # Output format: text, json, yaml, html, markdown, jira, confluence
  format: text
  # Write reports to timestamped files in this directory (null = standard output)
  output_dir: null
  # Hide findings below this severity: info, warning, critical (the exit code still counts them)
  min_severity: info
  # Colorize text output when writing to a terminal
  color: true
  # Snapshot to compare against: auto (newest in snapshot_dir), none, or a file path
  baseline: auto
  # Where snapshots are written and looked up
  snapshot_dir: /var/lib/pydebuprep/snapshots

# One section per check. 'enabled: false' leaves a check out; the other keys are
# that check's options. Override on the command line with
#   --check-option CHECK.OPTION=VALUE
checks:
  # Age of downloaded package lists (release)
  apt-lists-age:
    enabled: true
    # Report package lists older than this
    max_age_days: 7
  # APT sources (release)
  apt-sources:
    enabled: true
  # Operating system release (release)
  os-release:
    enabled: true
  # Packages no longer needed (packages; uses apt-get)
  apt-autoremove:
    enabled: true
  # Held packages (packages; uses apt-mark)
  apt-held:
    enabled: true
  # Pending package upgrades (packages; uses apt)
  apt-upgradable:
    enabled: true
  # Unmerged configuration files (packages)
  config-conflicts:
    enabled: true
    # Config files whose unmerged updates are critical; a trailing / means a directory
    critical_paths: ["/etc/ssh/sshd_config", "/etc/ssh/sshd_config.d/", "/etc/sudoers", "/etc/sudoers.d/"]
  # Package file checksums (packages; needs root; uses debsums)
  debsums:
    enabled: true
    # Give up after this many seconds
    timeout_seconds: 600
  # Broken or half-configured packages (packages; uses dpkg, apt-get)
  dpkg-audit:
    enabled: true
  # Leftover configuration of removed packages (packages; uses dpkg-query)
  dpkg-rc:
    enabled: true
  # Packages not available from any repository (packages; uses apt, dpkg-query)
  obsolete-packages:
    enabled: true
  # Free space on /boot and the EFI partition (boot)
  boot-space:
    enabled: true
    # Warn when free space or inodes drop below this percentage
    warning_pct: 25.0
    # Critical when free space or inodes drop below this percentage
    critical_pct: 10.0
  # Bootloader configuration (boot)
  bootloader:
    enabled: true
  # Out-of-tree kernel modules (DKMS) (boot; uses dkms)
  dkms:
    enabled: true
  # Running kernel (boot; uses uname)
  kernel-running:
    enabled: true
  # Boot time (services; uses systemd-analyze)
  boot-time:
    enabled: true
  # Kernel errors and warnings (services; needs root; uses dmesg)
  dmesg-errors:
    enabled: true
    # Regular expressions; matching kernel messages are left out
    ignore: []
  # Errors in the journal (current boot) (services; uses journalctl)
  journal-errors:
    enabled: true
    # Regular expressions; messages matching any of them (as 'IDENTIFIER: message') are left out
    ignore: []
  # Services using outdated libraries (services; needs root; uses needrestart)
  needrestart:
    enabled: true
  # Failed systemd units (services; uses systemctl)
  systemd-failed:
    enabled: true
    # Units to leave out (shell-style patterns)
    ignore_units: []
  # systemd timers (services; uses systemctl)
  systemd-timers:
    enabled: true
    # Timers to leave out (shell-style patterns)
    ignore_units: []
  # Free disk space and inodes (storage; uses df)
  disk-space:
    enabled: true
    # Also check network and FUSE filesystems (NFS, CIFS, sshfs, rclone, ...)
    include_remote: false
    # Warn when free space or inodes drop below this percentage
    warning_pct: 25.0
    # Critical when free space or inodes drop below this percentage
    critical_pct: 10.0
    # Mount points to leave out (shell-style patterns)
    exclude_mounts: []
  # /etc/fstab and mounts (storage; uses findmnt)
  fstab:
    enabled: true
