[build-system]
requires = ["setuptools>=59"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.coverage.run]
branch = true
source = ["pydebuprep"]

[tool.coverage.report]
# Every line and branch must be covered; mark genuinely untestable code with
# "# pragma: no cover" and a reason rather than lowering this.
fail_under = 100
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
