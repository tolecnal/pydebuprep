version: 2
updates:
  # Pinned action SHAs in .github/workflows/*.yml
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait before adopting a new release, so a compromised one can be pulled first.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Pinned tools in requirements-dev.txt, requirements-audit.txt and requirements-docs.txt
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # pyproject.toml's build-system floor (setuptools>=59) is a compatibility
      # promise, not a pin: Ubuntu 22.04 ships setuptools 59. Don't raise it.
      - dependency-name: setuptools
    groups:
      dev-tools:
        patterns: ["*"]
    commit-message:
      prefix: build
