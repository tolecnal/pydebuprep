name: Probe
on:
  push:
    branches: [ci/systemd-audit]
permissions: {}
jobs:
  probe:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - run: |
          set -x
          uname -a; ls /sys/firmware/efi || true; mount | grep efivar || true
          sudo apt-get install -y efibootmgr >/dev/null 2>&1; sudo efibootmgr -v || true
          cat /etc/resolv.conf; systemctl is-system-running || true
          systemctl --failed --no-legend || true
          docker info --format '{{.CgroupVersion}} {{.ServerVersion}}'
          systemctl is-active docker.service || true
          docker run --rm --privileged debian:trixie ls /sys/firmware/efi || true
