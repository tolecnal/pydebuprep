name: Release

# Pushing a tag vX.Y.Z builds the .deb once, installs and audits it on every supported
# release (package.yml, which CI also runs), then publishes it with SHA256SUMS and a
# build-provenance attestation as a GitHub Release. Run it manually (Actions -> Release
# -> Run workflow) to build and verify a branch without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  package:
    name: Package
    uses: $/.github/workflows/package.yml
    permissions:
      contents: read

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.deb
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.deb dist/SHA256SUMS \
            --title "pydebuprep ${TAG#v}" --generate-notes --verify-tag
